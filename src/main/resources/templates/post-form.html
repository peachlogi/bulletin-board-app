<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 글 작성</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form div { margin-bottom: 1em; }
        label { display: block; margin-bottom: 0.5em; }
        input[type="text"], textarea { width: 50%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>새 글 작성하기</h1>
    <form th:action="@{/posts}" th:object="${post}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div>
            <label for="author">작성자</label>
            <input type="text" id="author" th:field="*{author}" required>
        </div>
        <div>
            <label for="content">내용</label>
            <textarea id="content" rows="10" th:field="*{content}" required></textarea>
        </div>
        <button type="submit">저장하기</button>
    </form>
</body>
</html>
