<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글 상세</title>
    <style>
        body { font-family: sans-serif; margin: 2em; line-height: 1.6; }
        .post-container { border: 1px solid #ddd; padding: 20px; border-radius: 5px; margin-bottom: 2em; }
        .post-meta { color: #666; font-size: 0.9em; margin-bottom: 1em; }
        .comments-section { margin-top: 2em; }
        .comment { border-top: 1px solid #eee; padding: 10px 0; }
        .comment-form textarea { width: 100%; box-sizing: border-box; }
        .comment-form button { margin-top: 10px; padding: 8px 12px; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <a href="/posts">&larr; 목록으로 돌아가기</a>
    <div class="post-container">
        <h1 th:text="${post.title}">게시글 제목</h1>
        <div class="post-meta">
            <span>작성자: <b th:text="${post.author}">작성자 이름</b></span> |
            <span>작성일: <b th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성 시간</b></span>
        </div>
        <hr>
        <div th:text="${post.content}" style="white-space: pre-wrap;">
            게시글 내용이 여기에 들어갑니다.
        </div>
    </div>

    <div class="comments-section">
        <h2>댓글</h2>
        <!-- 댓글 목록 -->
        <div th:each="comment : ${post.comments}" class="comment">
            <p><strong><span th:text="${comment.author}">댓글 작성자</span></strong> (<span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">댓글 시간</span>)</p>
            <p th:text="${comment.content}">댓글 내용입니다.</p>
        </div>

        <!-- 댓글 작성 폼 -->
        <h3>댓글 쓰기</h3>
        <form th:action="@{/posts/{id}/comments(id=${post.id})}" th:object="${newComment}" method="post" class="comment-form">
            <div>
                <label for="author">작성자:</label>
                <input type="text" id="author" th:field="*{author}" required>
            </div>
            <div>
                <label for="content">내용:</label>
                <textarea id="content" rows="3" th:field="*{content}" required></textarea>
            </div>
            <button type="submit">댓글 등록</button>
        </form>
    </div>
</body>
</html>
